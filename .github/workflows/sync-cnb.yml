name: Sync to CNB

on:
  push:
    branches: [main]
    tags: ['**']
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 推送到 CNB 镜像
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          git remote add cnb "https://cnb:${CNB_TOKEN}@cnb.cool/konno/WUDDC/TAD6S4N10G-fnos.git"
          git push --force cnb main --tags
