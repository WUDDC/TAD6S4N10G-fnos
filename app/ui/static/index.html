<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>N100/N305 功耗卫士</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand-mark" aria-hidden="true">⚡</div>
      <div>
        <p class="eyebrow">fnOS Power Guard</p>
        <h1>N100/N305 功耗卫士</h1>
        <p class="subtitle">限制 CPU 与核显共享的 Package 功耗，抑制 GPU 调用时的快速升温。</p>
      </div>
      <span id="health" class="badge pending">读取中</span>
    </header>

    <section class="metrics" aria-label="运行状态">
      <article><span>处理器</span><strong id="cpu-model">—</strong></article>
      <article><span>Package 温度</span><strong id="temperature">—</strong></article>
      <article><span>当前 PL1</span><strong id="current-pl1">—</strong></article>
      <article><span>当前 PL2</span><strong id="current-pl2">—</strong></article>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <h2>功耗限制</h2>
          <p>推荐值按处理器自动生成；PL1 控制持续功耗，PL2 控制短时峰值。</p>
        </div>
        <label class="toggle"><input id="enabled" type="checkbox"><span></span>启用限制</label>
      </div>

      <form id="config-form">
        <label>
          <span>PL1 持续功耗</span>
          <div class="input-wrap"><input id="pl1" type="number" step="1" required><b>W</b></div>
          <small id="pl1-range">—</small>
        </label>
        <label>
          <span>PL2 短时功耗</span>
          <div class="input-wrap"><input id="pl2" type="number" step="1" required><b>W</b></div>
          <small id="pl2-range">—</small>
        </label>
        <label>
          <span>自动校验间隔</span>
          <div class="input-wrap"><input id="interval" type="number" min="5" max="300" step="1" required><b>秒</b></div>
          <small>系统或休眠恢复覆盖限制后自动重应用</small>
        </label>
        <div class="actions">
          <button type="submit" class="primary">保存并应用</button>
          <button id="apply-now" type="button">立即重应用</button>
          <button id="restore" type="button" class="danger">恢复安装前配置</button>
        </div>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section class="details">
      <h2>诊断信息</h2>
      <dl>
        <div><dt>识别配置</dt><dd id="profile">—</dd></div>
        <div><dt>GPU 运行状态</dt><dd id="gpu-runtime">—</dd></div>
        <div><dt>最近应用</dt><dd id="last-apply">—</dd></div>
        <div><dt>状态</dt><dd id="last-error">—</dd></div>
      </dl>
      <p class="notice">降低功耗可能减少极限性能，但不会修改 BIOS、内核或飞牛系统文件。停止或卸载插件时会恢复首次安装前捕获的限制。</p>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
